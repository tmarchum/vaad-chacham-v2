name: CI

# Runs tests + build on every push/PR so regressions are caught before deploy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # --max-warnings is deliberately NOT set: errors gate the build,
      # warnings (react-hooks compiler rules) stay visible but don't block.
      - run: npm run lint
      - run: npm test
      - run: npm run build
