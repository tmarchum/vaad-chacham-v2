name: Monthly summary email

# Emails each building's financial summary to the admins on the 1st of the
# month. Also runnable manually (Actions → Run workflow).
on:
  schedule:
    - cron: "0 8 1 * *" # 08:00 UTC, 1st of every month
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly-summary function
        run: |
          curl -fsS -X POST \
            "https://stncskqjrmecjckxldvi.supabase.co/functions/v1/monthly-summary" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}'
