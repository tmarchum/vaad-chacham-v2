name: Generate signing keystore (one-off)

# Run manually once. Generates a fixed debug keystore and uploads it as an
# artifact; we commit it so every APK build is signed identically (installs
# over the previous version without uninstalling). Delete after use.

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore vaadplus.keystore \
            -storepass vaadplus -keypass vaadplus \
            -alias vaadplus -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=vaadplus, OU=app, O=vaadplus, L=TLV, S=IL, C=IL"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: vaadplus-keystore
          path: vaadplus.keystore
          if-no-files-found: error
