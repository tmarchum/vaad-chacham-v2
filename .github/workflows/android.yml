name: Build Android APK

# Builds the Capacitor Android app in the cloud — no local Android toolchain
# needed. Run it manually (Actions → "Build Android APK" → Run workflow) or it
# runs automatically on pushes to the android feature branch. The installable
# APK is uploaded as a build artifact you can download and sideload.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK to a Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vaadplus.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaadplus-debug-apk
          path: vaadplus.apk
          if-no-files-found: error

      # Publish to a fixed-tag Release so the portal has a stable public
      # download URL: .../releases/download/android-latest/vaadplus.apk
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: אפליקציית וועד+ (אנדרואיד)
          body: |
            הגרסה האחרונה של אפליקציית האנדרואיד. הורד את vaadplus.apk והתקן בנייד.
            (נבנה אוטומטית מ-${{ github.sha }})
          files: vaadplus.apk
          make_latest: 'true'
