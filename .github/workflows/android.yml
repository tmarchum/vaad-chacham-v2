name: Build Android APK

# Builds the Capacitor Android app in the cloud — no local Android toolchain
# needed. Runs manually (Actions → "Build Android APK" → Run workflow), on
# pushes to the android feature branch, and on main pushes that touch the
# native side (so the public android-latest APK never goes stale).
# The APK is a SIGNED RELEASE build — the keystore comes from repo secrets
# (the old committed keystore was burned and replaced on 2026-10-05).

# The APK BUNDLES the web assets (no remote server.url), so web changes go
# stale on installed phones unless the APK is rebuilt — hence src/** etc.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-app
      - main
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK to a Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NOTE: no setup-android action — the ubuntu-latest image ships the
      # Android SDK preinstalled, and setup-android@v3 broke on the 2026 image
      # ("Failed to find package 'tools'").

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_BUILD: ${{ github.run_number }}-${{ github.sha }}

      - name: Capacitor sync (Android)
        run: npx cap sync android

      # Firebase config for push notifications. Optional: when the secret is
      # missing the build still succeeds (the google-services plugin is applied
      # only if the file exists) and push simply stays off.
      - name: Write google-services.json from secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json written — push enabled"
          else
            echo "No GOOGLE_SERVICES_JSON secret — building without push"
          fi

      - name: Write signing keystore from secrets
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vaadplus-release.p12"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/vaadplus-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: vaadplus
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk vaadplus.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaadplus-release-apk
          path: vaadplus.apk
          if-no-files-found: error

      # Publish to a fixed-tag Release so the portal has a stable public
      # download URL: .../releases/download/android-latest/vaadplus.apk
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: אפליקציית ועדלי (אנדרואיד)
          body: |
            הגרסה האחרונה של אפליקציית האנדרואיד. הורד את vaadplus.apk והתקן בנייד.
            שים לב: גרסה זו חתומה במפתח חדש — אם מותקנת גרסה מלפני 10/2026, יש להסיר אותה פעם אחת ולהתקין מחדש.
            (נבנה אוטומטית מ-${{ github.sha }})
            build:${{ github.run_number }}
          files: vaadplus.apk
          make_latest: 'true'
